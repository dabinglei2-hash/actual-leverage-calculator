<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实际杠杆计算器</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#262622;font:16px/1.6 system-ui,sans-serif;padding:24px}main{max-width:560px;margin:auto}h1{font-size:24px;margin:0 0 20px}fieldset{border:0;padding:0;margin:0 0 20px;display:flex;gap:10px}button{flex:1;padding:12px;border:1px solid #ddd;border-radius:9px;background:white;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#234e42;color:white;border-color:#234e42}label{display:block;margin:18px 0 6px;font-weight:600}input{width:100%;font:inherit;font-size:22px;padding:12px;border:1px solid #ccc;border-radius:9px;background:white;color:#222}input:focus,button:focus-visible{outline:3px solid #9bcab7;outline-offset:2px}.hint{font-size:14px;color:#666}section{margin-top:24px;background:#e8f0eb;border-radius:14px;padding:24px}output{display:block;font-size:clamp(32px,9vw,56px);font-weight:700;overflow-wrap:anywhere;color:#234e42}#error{color:#a33;font-size:14px;min-height:24px;margin:8px 0}footer{font-size:12px;color:#777;margin-top:20px}@media(max-width:360px){body{padding:16px}}</style><main><h1>实际杠杆</h1><fieldset aria-label="保证金模式"><button type="button" aria-pressed="true" id="isolated">逐仓</button><button type="button" aria-pressed="false" id="cross">全仓</button></fieldset><p id="explain" class="hint">逐仓：风险权益填写该仓位的当前逐仓权益（保证金及浮动盈亏）。</p><label for="notional">持仓名义价值 · USDT</label><input id="notional" type="number" step="any" min="0" inputmode="decimal" placeholder="例如 10000" autocomplete="off"><label for="equity">风险权益 · USDT</label><input id="equity" type="number" step="any" min="0" inputmode="decimal" placeholder="例如 1000" autocomplete="off" aria-describedby="explain"><section aria-live="polite"><span>实际杠杆倍率</span><output id="result">—</output><div id="error">请输入两个大于 0 的数值</div><div class="hint">持仓名义价值 ÷ 风险权益</div></section><footer>仅在当前页面计算，不上传、不保存输入。倍率不代表爆仓价格。</footer></main><script>
const n=document.getElementById('notional'),e=document.getElementById('equity'),r=document.getElementById('result'),err=document.getElementById('error');
function calculate(){const a=n.valueAsNumber,b=e.valueAsNumber;r.textContent='—';if(n.validity.badInput||e.validity.badInput){err.textContent='请输入有效数字';return}if(n.value===''||e.value===''){err.textContent='请输入两个大于 0 的数值';return}if(!Number.isFinite(a)||!Number.isFinite(b)||a<=0||b<=0){err.textContent='持仓名义价值和风险权益必须大于 0';return}const value=a/b;if(!Number.isFinite(value)||value===0){err.textContent='数值超出计算范围，请调整输入';return}r.textContent=(value<0.01||value>=1e9?value.toExponential(3):value.toLocaleString('zh-CN',{maximumFractionDigits:2}))+' 倍';err.textContent=''}
[n,e].forEach(el=>el.addEventListener('input',calculate));['isolated','cross'].forEach(id=>document.getElementById(id).onclick=()=>{['isolated','cross'].forEach(k=>document.getElementById(k).setAttribute('aria-pressed',String(k===id)));document.getElementById('explain').textContent=id==='isolated'?'逐仓：风险权益填写该仓位的当前逐仓权益（保证金及浮动盈亏）。':'全仓：风险权益填写支撑仓位的当前全仓账户权益。若计算整个账户，持仓名义价值应填写所有仓位绝对名义价值之和（不抵消多空）。';});
</script></html>
